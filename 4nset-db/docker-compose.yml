services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nset
    ports:
      - "5432:5432"
    volumes:
      - nset_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nset"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  nset_pgdata:
